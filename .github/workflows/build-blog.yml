name: Build blog pages

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "scripts/build-blog.js"
      - "package.json"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node scripts/build-blog.js

      - name: Commit generated blog pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog.html blog/ sitemap.xml
          git diff --cached --quiet || git commit -m "Build: regenerate static blog pages [skip ci]"
          git push
